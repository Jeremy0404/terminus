name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to run, without the leading v (for example 1.4.2)
        required: true
        type: string

# Runs an older, already-published release again: verifies that its image was
# signed by release.yml, then runs deploy/rollback.sh on the host over SSH.
# It never migrates: roll back only to a version the current schema supports.
permissions:
  contents: read

jobs:
  rollback:
    name: Roll back production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version format
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version like 1.4.2, got '$VERSION'." >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify the image was signed by the release workflow
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v.*$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"

      - name: Roll back over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: RELEASE_VERSION
          script: |
            set -euo pipefail
            cd ~/{{SLUG}}
            ./deploy/rollback.sh "$RELEASE_VERSION"
