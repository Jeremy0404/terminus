name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

# Maintains the single release pull request and, once it is merged, tags the
# release. It never builds or deploys: the v* tag it pushes starts release.yml.
#
# It uses RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN: a tag pushed with
# GITHUB_TOKEN does not start other workflows, so release.yml would never run.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
