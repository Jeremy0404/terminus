id: task
phases:
  - id: spec
    skill: spec
  - id: grill
    skill: grill
    output: decisions
  - id: plan
    skill: plan
    gate: plan-approval
  - id: execute
    skill: execute-tdd
  - id: verify
    executor: checks
    retryFrom: execute
  - id: review
    skill: review
    output: review
    gate: human-review
  - id: sync
    executor: sync
    skill: resolve-conflicts
    retryFrom: execute
  - id: merge
    executor: code-host
    gate: merge
