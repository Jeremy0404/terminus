id: task
phases:
  - id: spec
    skill: spec
    output: verdict
    skippable: true
  - id: grill
    skill: grill
    output: decisions
    tracks: [standard]
    skippable: true
  - id: plan
    skill: plan
    gate: plan-approval
    tracks: [standard]
    skippable: true
  - id: execute
    skill: execute-tdd
  - id: verify
    executor: checks
    retryFrom: execute
  - id: review
    skill: review
    output: review
    gate: human-review
    skippable: true
  - id: sync
    executor: sync
    skill: resolve-conflicts
    retryFrom: execute
  - id: merge
    executor: code-host
    gate: merge
  - id: retro
    skill: retro
    output: memory
    skippable: true
