name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

# This workflow versions the application and creates GitHub Releases. It never
# builds deployable artifacts, accesses runtime secrets, or deploys.
permissions:
  contents: write
  pull-requests: write
  issues: write

# Keep at most one maintainer of the single Release PR. Do not cancel a run:
# every merged conventional commit must be considered for that PR.
concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
